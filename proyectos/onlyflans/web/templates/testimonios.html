{% extends 'base.html' %}

{% block content %}
<h2>Lo que dicen nuestros clientes</h2>

<div class="row mt-4">
  {% for t in testimonios %}
  <div class="col-md-4 mb-4">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ t.customer_name }}</h5>
        <p class="card-text">{{ t.comment }}</p>
        <p class="card-text">⭐ {{ t.rating }}/5</p>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
