{% extends 'base.html' %}

{% block content %}
<div class="row mt-4">
  <div class="col-md-6 offset-md-3">
    <h3 class="text-center">Contáctanos</h3>
    <form action="/contacto" method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}

      <div class="mb-3">
        <label for="{{ form.customer_name.id_for_label }}" class="form-label">
          {{ form.customer_name.label_tag }}
        </label>
        {{ form.customer_name }}
        <div class="text-danger">
          {{ form.customer_name.errors }}
        </div>
      </div>

      <div class="mb-3">
        <label for="{{ form.customer_email.id_for_label }}" class="form-label">
          {{ form.customer_email.label_tag }}
        </label>
        {{ form.customer_email }}
        <div class="text-danger">
          {{ form.customer_email.errors }}
        </div>
      </div>

      <div class="mb-3">
        <label for="{{ form.message.id_for_label }}" class="form-label">
          {{ form.message.label_tag }}
        </label>
        {{ form.message }}
        <div class="text-danger">
          {{ form.message.errors }}
        </div>
      </div>

      <input type="submit" value="Enviar" class="btn btn-primary mt-3">
    </form>
  </div>
</div>
{% endblock %}
